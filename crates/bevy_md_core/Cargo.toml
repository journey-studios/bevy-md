[package]
name = "bevy_md_core"
description = "Engine-free markdown block model with incremental and streaming parsing, built for bevy_md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
bench = false

[dependencies]
pulldown-cmark.workspace = true
rustc-hash.workspace = true
unicase.workspace = true

[dev-dependencies]
allocation-counter.workspace = true
criterion.workspace = true
serde_json.workspace = true
# Thread CPU time for the stage probe (`benches/stages.rs`): safe API.
rustix = { version = "1", default-features = false, features = ["std", "time"] }

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "stages"
harness = false

[lints]
workspace = true
